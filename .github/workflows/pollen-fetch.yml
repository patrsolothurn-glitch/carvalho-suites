name: Pollen Fetch (MeteoSwiss)

on:
  schedule:
    - cron: '0 */3 * * *'   # a cada 3 horas
  workflow_dispatch: {}       # correr manualmente para testar

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar pollen_estacoes / pollen_medicoes a partir da MeteoSwiss
        env:
          SUPABASE_URL: https://qtynznppkxjmihxiquze.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/pollen-fetch.py
