# Backup diário do Supabase para o repositório PRIVADO
# patrsolothurn-glitch/carvalho-backups (P1b, ver REVISAO-PROGRESSO.md).
# Nunca escreve nem comita nada no carvalho-suites (que é público) — só
# clona e grava no repositório privado, usando o secret BACKUP_REPO_TOKEN.
name: Backup Supabase Data

permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * *'   # Todos os dias às 03:00 UTC (04:00/05:00 na Suíça)
  workflow_dispatch:       # Permite correr manualmente em qualquer altura
    inputs:
      simular_queda:
        description: 'Teste do alerta: finge (só em memória) que escolar_notas tinha 8 linhas ontem e 0 hoje'
        type: boolean
        default: false

jobs:
  backup:
    runs-on: ubuntu-latest
    outputs:
      has_alertas: ${{ steps.comparar.outputs.has_alertas }}
      data: ${{ steps.comparar.outputs.data }}
      simulado: ${{ steps.comparar.outputs.simulado }}
      corpo: ${{ steps.comparar.outputs.corpo }}
    steps:
      - name: Obter o script de comparação (só scripts/ deste repositório)
        uses: actions/checkout@v4
        with:
          path: carvalho-suites
          sparse-checkout: scripts
          persist-credentials: false

      - name: Clonar carvalho-backups (repositório privado)
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/patrsolothurn-glitch/carvalho-backups.git" carvalho-backups
          git -C carvalho-backups config user.name "Carvalho Backup Bot"
          git -C carvalho-backups config user.email "backup@carvalho-suite.local"
          # carvalho-backups pode ainda não ter nenhuma branch (repo mesmo
          # vazio) — o clone dá HEAD sem nenhum commit nesse caso.
          if ! git -C carvalho-backups rev-parse --verify HEAD > /dev/null 2>&1; then
            echo "carvalho-backups está vazio — a criar a branch main"
            git -C carvalho-backups checkout -b main
          fi

      - name: Exportar e validar tabelas do Supabase
        env:
          SUPABASE_URL: https://qtynznppkxjmihxiquze.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          DIR="carvalho-backups/backups/$DATE"
          mkdir -p "$DIR"
          # Mesma lista de tabelas de sempre + wplan_pensum + wplan_notizen (tabelas novas,
          # criada para o P17). family_trips_list NÃO entra: só é usada no
          # código com .select() (leitura), nunca com insert/update/delete
          # como a tabela family_trips — tudo indica que é uma view sobre
          # family_trips, e as views não têm backup próprio aqui (o backup
          # da tabela de base já as cobre).
          TABLES="profiles members horas_entries agenda_pro_jobs family_events nutri_products escolar_disciplinas escolar_horario escolar_notas escolar_tpc push_subscriptions subscriptions lucas_condutores lucas_visitantes lucas_semana lucas_config horaspro_settings horaspro_projects horas_projects agenda_monteurs escolar_eventos escolar_perfil hauswart_data rapport_planung rapport_tages rapport_wochen family_trips voz_pastas voz_gravacoes wplan_leute wplan_tasks wplan_tag wplan_notizen wplan_pensum pending_invites horas_voz horas_voz_config pollen_perfis pollen_diario pollen_termos fitness_perfil fitness_refeicoes fitness_alimentos fitness_opcoes fitness_opcao_itens fitness_registo fitness_agua fitness_compras fitness_avaliacoes fitness_fotos fitness_treinos fitness_exercicios fitness_treino_log hwx_clientes hwx_servicos hwx_config hwx_locais hwx_ofertas"

          echo "## 🗄️ Backup Supabase — $DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tabela | Linhas |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          PAGE_SIZE=1000
          N=0
          for T in $TABLES; do
            echo "A exportar $T..."
            echo "[]" > "$DIR/$T.json"
            OFFSET=0
            while true; do
              END=$((OFFSET + PAGE_SIZE - 1))
              PAGEFILE=$(mktemp)
              if ! curl -sf "$SUPABASE_URL/rest/v1/$T?select=*" \
                  -H "apikey: $SUPABASE_KEY" \
                  -H "Authorization: Bearer $SUPABASE_KEY" \
                  -H "Range: $OFFSET-$END" \
                  -o "$PAGEFILE"; then
                echo "✗ tabela $T falhou (pedido ao Supabase sem sucesso, página $OFFSET-$END)"
                rm -f "$PAGEFILE"
                exit 1
              fi
              if ! jq -e 'type == "array"' "$PAGEFILE" > /dev/null 2>&1; then
                echo "✗ tabela $T falhou (resposta não é um array JSON válido, página $OFFSET-$END)"
                rm -f "$PAGEFILE"
                exit 1
              fi
              PAGE_LEN=$(jq 'length' "$PAGEFILE")
              jq -s '.[0] + .[1]' "$DIR/$T.json" "$PAGEFILE" > "$DIR/$T.json.tmp"
              mv "$DIR/$T.json.tmp" "$DIR/$T.json"
              rm -f "$PAGEFILE"
              if [ "$PAGE_LEN" -lt "$PAGE_SIZE" ]; then
                break
              fi
              OFFSET=$((OFFSET + PAGE_SIZE))
            done
            LINHAS=$(jq 'length' "$DIR/$T.json")
            echo "  ✓ $T: $LINHAS linhas"
            echo "| $T | $LINHAS |" >> "$GITHUB_STEP_SUMMARY"
            N=$((N + 1))
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total: $N tabelas exportadas com sucesso.**" >> "$GITHUB_STEP_SUMMARY"
          echo "Total: $N tabelas exportadas com sucesso."

      # Só leitura: compara com a pasta de backup anterior e prepara o alerta.
      # Nunca falha o backup (o script sai sempre com 0; continue-on-error é cinto e
      # suspensórios). Se houver alertas, o backup é comitado na mesma (a cópia é a
      # prova) e o job 'alerta-issue' abre UMA issue.
      - name: Comparar com o backup anterior (só leitura)
        id: comparar
        continue-on-error: true
        env:
          # Tabelas a ignorar na comparação (separadas por espaço) — para afinar falsos positivos
          IGNORAR: ""
          SIMULAR: ${{ github.event.inputs.simular_queda == 'true' }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BACKUPS_DIR=carvalho-backups/backups DATE="$DATE" bash carvalho-suites/scripts/backup-comparar.sh

      - name: Apagar backups com mais de 90 dias (pela data no nome da pasta)
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '90 days ago' +%Y-%m-%d)
          cd carvalho-backups/backups
          for d in */; do
            NAME="${d%/}"
            if [[ "$NAME" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$NAME" < "$CUTOFF" ]]; then
              echo "A apagar $NAME (mais de 90 dias, pela data no nome)"
              rm -rf "$NAME"
            fi
          done

      - name: Comitar e enviar para carvalho-backups
        run: |
          set -euo pipefail
          cd carvalho-backups
          git add backups/
          git diff --staged --quiet && echo "Nada novo para comitar" || git commit -m "🗄️ Backup automático $(date -u +%Y-%m-%d)"
          git push origin HEAD:main

  # Abre a issue de alerta. Só este job tem issues: write; corre depois de o
  # backup ter sido exportado, comparado e comitado com sucesso.
  alerta-issue:
    needs: backup
    if: needs.backup.outputs.has_alertas == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Abrir issue de alerta (sem conteúdo de linhas)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA: ${{ needs.backup.outputs.data }}
          SIMULADO: ${{ needs.backup.outputs.simulado }}
          CORPO: ${{ needs.backup.outputs.corpo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITULO="⚠️ Backup ${DATA}: tabelas com perda de dados"
          [ "$SIMULADO" = "true" ] && TITULO="[TESTE] $TITULO"
          {
            printf '%s\n' "$CORPO"
            echo
            echo "Run: $RUN_URL"
          } > corpo.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITULO" --body-file corpo.md --assignee patrsolothurn-glitch
