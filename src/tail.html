  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
      });
      // Aviso não-intrusivo de nova versão (em vez de reload automático,
      // que já foi removido antes por apagar formulários a meio do preenchimento).
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (window.__cvUpdateBannerShown) return;
        window.__cvUpdateBannerShown = true;
        var bar = document.createElement('div');
        bar.textContent = '🔄 Nova versão disponível — toca para atualizar';
        bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#1a237e;color:#fff;text-align:center;padding:12px 16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 -2px 10px rgba(0,0,0,.2)';
        bar.onclick = function () { window.location.reload(); };
        document.body.appendChild(bar);
      });
    }
  </script>
